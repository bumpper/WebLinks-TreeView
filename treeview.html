<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>TreeView - CHM Style</title>
    <style>
        body {
            margin: 0;
            font-family: Tahoma, Arial, sans-serif;
            background: #f3f3f3;
            color: #222;
        }
        .treeview {
            padding: 0.5em 0.5em 0.5em 0.2em;
            box-sizing: border-box;
            overflow-x: auto;
            white-space: nowrap;
        }
        ul.tree {
            list-style: none;
            margin: 0;
            padding: 0;
        }
        .tree li {
            line-height: 1.7em;
            position: relative;
            padding-left: 1.2em;
            cursor: pointer;
            user-select: none;
        }
        .tree li .icon {
            width: 16px;
            height: 16px;
            vertical-align: middle;
            margin-right: 4px;
        }
        /* Only style the label text, not the toggle */
        .tree li span.label {
            font-size: 11px !important;
            font-weight: normal !important;
            white-space: nowrap;
        }
        /* Prevent wrapping for legacy nodes too */
        .treeview span, .treeview div span {
            white-space: nowrap;
        }
        /* Make sure the file icon image is always sized correctly */
        .tree li img.icon {
            width: 16px !important;
            height: 16px !important;
            vertical-align: middle;
            margin-right: 4px;
        }
        .tree li.selected > span {
            background: #cce6ff;
            border-radius: 3px;
        }
        .tree li:hover > span {
            background: #e6f2ff;
            border-radius: 3px;
        }
        .toggle {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 2px;
            vertical-align: middle;
            text-align: center;
            font-size: 13px;
            color: #666;
            cursor: pointer;
        }
        .toggle {
            display: inline-block;
            width: 14px;
            height: 14px;
            margin-right: 2px;
            vertical-align: middle;
            text-align: center;
            cursor: pointer;
            background: none;
        }
        .toggle svg {
            width: 14px;
            height: 14px;
            display: inline-block;
            vertical-align: middle;
        }
        .tree li.file > .toggle {
            visibility: hidden;
        }
    </style>
</head>
<body>
    
    <div class="treeview">
        <ul class="tree" id="tree-root">
            <!-- Tree will be rendered here -->
        </ul>
    </div>
    <script>
        // Classic .chm style icons
        const plusIcon = `<img class="toggle-icon" src="img/+.png" alt="+" width="16" height="16" style="vertical-align:middle;">`;
        const minusIcon = `<img class="toggle-icon" src="img/-.png" alt="-" width="16" height="16" style="vertical-align:middle;">`;
        const folderClosed = `<img class="folder-icon" src="img/closed.png" alt="[+]" width="16" height="16" style="vertical-align:middle;">`;
        const folderOpen = `<img class="folder-icon" src="img/open.png" alt="[-]" width="16" height="16" style="vertical-align:middle;">`;
        const fileIcon = `<img class='icon' src='img/connector.png' alt='|' width='16' height='16' style='vertical-align:middle;margin-right:2px;'><img class='icon' src='img/page.png' alt='Page' width='16' height='16' style='vertical-align:middle;'>`;


        // Tree rendering function (kept for external use)
        function renderTree(data, parent, depth = 0) {
            data.forEach(node => {
                const li = document.createElement('li');
                li.classList.add(node.children ? 'folder' : 'file');
                if (node.children) {
                    li.classList.add('collapsed');
                    // Start collapsed by default
                    let expanded = false;
                    li.innerHTML = `<span class="toggle" style="vertical-align:middle;display:inline-block;height:16px;line-height:16px;">${plusIcon}</span><span class="folder-icon-wrapper" style="vertical-align:middle;display:inline-block;height:16px;line-height:16px;">${folderClosed}</span><span class="folder-spacer" style="display:inline-block;width:4px;"></span><span class="label">${node.label}</span>`;
                    const ul = document.createElement('ul');
                    ul.style.display = 'none';
                    renderTree(node.children, ul, depth + 1);
                    li.appendChild(ul);


                    // Toggle handler (for both plus/minus and folder icon)
                    function toggleFolder(e) {
                        e.stopPropagation();
                        expanded = ul.style.display === 'block';
                        ul.style.display = expanded ? 'none' : 'block';
                        li.classList.toggle('expanded', !expanded);
                        // Update both icons
                        const toggleSpan = li.querySelector('.toggle');
                        if (toggleSpan) toggleSpan.innerHTML = expanded ? plusIcon : minusIcon;
                        // Replace folder icon with closed.png or open.png
                        let folderWrapper = li.querySelector('.folder-icon-wrapper');
                        if (folderWrapper) {
                            const newImg = document.createElement('img');
                            newImg.className = 'folder-icon';
                            newImg.src = expanded ? 'img/closed.png' : 'img/open.png';
                            newImg.alt = expanded ? '[+]' : '[-]';
                            newImg.width = 16;
                            newImg.height = 16;
                            newImg.style.verticalAlign = 'middle';
                            newImg.style.cursor = 'pointer';
                            newImg.onclick = toggleFolder;
                            folderWrapper.innerHTML = '';
                            folderWrapper.appendChild(newImg);
                        }
                        // Re-attach toggle icon listener
                        attachToggleListeners();
                        console.log('[DEBUG] Toggle clicked:', node.label, 'Now expanded:', !expanded);
                    }

                    // Attach listeners to folder icon
                    function attachFolderListeners() {
                        let folderImg = li.querySelector('.folder-icon');
                        if (folderImg) {
                            folderImg.onclick = toggleFolder;
                            folderImg.style.cursor = 'pointer';
                        }
                    }
                    // Attach listeners to plus/minus icon
                    function attachToggleListeners() {
                        const toggleIcon = li.querySelector('.toggle-icon');
                        if (toggleIcon) {
                            toggleIcon.onclick = toggleFolder;
                            toggleIcon.style.cursor = 'pointer';
                        }
                    }
                    attachFolderListeners();
                    attachToggleListeners();

                    li.querySelector('span.label').onclick = function(e) {
                        e.stopPropagation();
                        selectNode(li);
                        console.log('[DEBUG] Node selected:', node.label);
                    };
                } else {
                    // Use flex to keep icon and label on one line, never wrap
                    li.style.display = 'flex';
                    li.style.alignItems = 'center';
                    li.style.whiteSpace = 'nowrap';
                    // Do not set overflow on li; allow it to expand
                    li.innerHTML = `<span class="toggle"></span>${fileIcon}<span class="label">${node.label}</span>`;
                    const label = li.querySelector('span.label');
                    label.style.cursor = 'pointer';
                    label.style.flex = '0 1 auto';
                    label.style.overflow = 'visible';
                    label.style.textOverflow = 'unset';
                    label.style.whiteSpace = 'nowrap';
                    label.onclick = function(e) {
                        e.stopPropagation();
                        selectNode(li);
                        // Try to open in preview.html frame (named 'rightFrame')
                        let loaded = false;
                        try {
                            let frame = null;
                            if (window.top && window.top.frames && window.top.frames['rightFrame']) {
                                frame = window.top.frames['rightFrame'];
                            } else if (window.parent && window.parent.frames && window.parent.frames['rightFrame']) {
                                frame = window.parent.frames['rightFrame'];
                            }
                            if (frame && typeof frame.location !== 'undefined') {
                                frame.location.href = node.url;
                                loaded = true;
                            }
                        } catch (err) {
                            console.log('[DEBUG] Frame navigation error:', err);
                        }
                        if (!loaded) {
                            window.open(node.url, '_blank'); // fallback
                        }
                        console.log('[DEBUG] Leaf selected and loaded:', node.label, node.url, 'Loaded in frame:', loaded);
                    };
                }
                parent.appendChild(li);
                console.log('[DEBUG] Rendered node:', node.label, 'Has children:', !!node.children);
            });
        }

        function selectNode(li) {
            document.querySelectorAll('.tree li.selected').forEach(el => el.classList.remove('selected'));
            li.classList.add('selected');
        }

        // --- Bookmark Parsing and Tree Data Handling (from legacy section, improved) ---
        function parseBookmarks(raw, type) {
            if (type === 'json') {
                try {
                    const data = JSON.parse(raw);
                    // Firefox JSON: look for roots/bookmark_bar or children
                    if (data.roots && data.roots.bookmark_bar) {
                        return data.roots.bookmark_bar.children || [];
                    }
                    if (data.children) return data.children;
                    return [];
                } catch (e) { return []; }
            } else if (type === 'html' || type === 'htm') {
                // Parse Netscape HTML format
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');
                function walkDL(dl) {
                    let tree = [];
                    for (const node of dl.children) {
                        if (node.tagName === 'DT') {
                            const h3 = node.querySelector('h3');
                            if (h3) {
                                // Folder
                                const folder = {
                                    label: h3.textContent,
                                    children: [],
                                };
                                const subDL = node.nextElementSibling;
                                if (subDL && subDL.tagName === 'DL') {
                                    folder.children = walkDL(subDL);
                                }
                                tree.push(folder);
                            } else {
                                // Bookmark
                                const a = node.querySelector('a');
                                if (a) {
                                    tree.push({
                                        label: a.textContent,
                                        url: a.getAttribute('href')
                                    });
                                }
                            }
                        }
                    }
                    return tree;
                }
                const rootDL = doc.querySelector('dl');
                return rootDL ? walkDL(rootDL) : [];
            }
            return [];
        }

        function getUploadedBookmarks() {
            let raw = localStorage.getItem('uploadedBookmarks');
            let type = localStorage.getItem('uploadedBookmarksType');
            if (!raw) return null;
            if (!type) type = 'json';
            try {
                return parseBookmarks(raw, type);
            } catch (e) { return null; }
        }

        function renderUploadedBookmarks() {
            const treeRoot = document.getElementById('tree-root');
            treeRoot.innerHTML = '';
            const bookmarks = getUploadedBookmarks();
            if (bookmarks && bookmarks.length) {
                renderTree(bookmarks, treeRoot);
            }
        }

        // Initial render if bookmarks are present
        renderUploadedBookmarks();

        // Listen for storage events (from upload in weblinks.html)
        window.addEventListener('storage', function(e) {
            if (e.key === 'uploadedBookmarks' || e.key === 'bookmarksUpdated') {
                renderUploadedBookmarks();
            }
        });
    </script>
</body>
