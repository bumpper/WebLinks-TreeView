                    lastMessageRender = Date.now();
                    stopTreeRecovery();
                    /* Keep our own copy so the tree survives a reload even when
                     * the importer's storage is a different origin. */
                    WeblinksBookmarks.saveTree(data.tree,
                        data.stats && data.stats.name ? data.stats.name : undefined);
                    render(data.tree);
                    if (data.stats) WeblinksBookmarks.postStatsToRightFrame(data.stats);
                    notifyAutoExport();
                } else if (data.type === 'weblinks:sync-result') {
                    stopSyncSpin();
                    setMessage(data.message || 'Sync complete.', !data.ok);
                    setTimeout(clearMessage, 4000);
                } else if (data.type === 'weblinks:tree-updated') {
                    if (Date.now() - lastMessageRender < 1500) return;
                    scheduleStorageRender();
                }
            });

            function applyDarkMode() {
                document.body.classList.toggle('dark-mode', localStorage.getItem('darkMode') === 'true');
            }

            function setDarkMode(dark) {
                document.body.classList.toggle('dark-mode', !!dark);
                try {
                    localStorage.setItem('darkMode', dark ? 'true' : 'false');
                } catch (err) { /* ignore */ }
            }

            function rightFrameDoc() {
                var right = getRightFrame();
                if (!right || right === window) return null;
                var doc;
                try { doc = right.document; } catch (err) { return null; }
                if (!doc || doc.readyState !== 'complete' || !doc.body) return null;
                /* Only preview.html owns the mode switch; this skips about:blank
                 * and bookmarked pages opened in the right panel. */
                if (!doc.getElementById || !doc.getElementById('dark-mode-toggle')) return null;
                return doc;
            }

            /* The right panel is the source of truth. Mirror its state (and
             * remember it) so the next visit opens in the same mode. */
            function applyModeFromRightFrame() {
                var doc = rightFrameDoc();
                if (!doc) return false;
                setDarkMode(doc.body.classList.contains('dark-mode'));
                return true;
            }

            function watchRightFrameLoad() {
                var right = getRightFrame();
                if (!right || right === window) return false;
                try {
                    if (right.__weblinksModeWatched) return true;
                    right.addEventListener('load', function () {
                        applyModeFromRightFrame();
                    });
                    right.__weblinksModeWatched = true;
                } catch (err) { return false; }
                return true;
            }

            var modeTimer = null;
            var modeTries = 0;

            /* Restore the last remembered state first, then match the right
             * panel as soon as its document is ready. The frames load
             * independently, so keep checking until preview.html is available. */
            applyDarkMode();
            var modeMatched = applyModeFromRightFrame();
            watchRightFrameLoad();
            if (!modeMatched) {
                modeTimer = setInterval(function () {
                    watchRightFrameLoad();
                    if (applyModeFromRightFrame() || ++modeTries > 100) {
                        clearInterval(modeTimer);
                        modeTimer = null;
                    }
                }, 100);
            }

            window.addEventListener('storage', function (e) {
                if (e.key === 'darkMode') {
                    applyDarkMode();
                    return;
                }
                if (e.key === WeblinksBookmarks.TREE_KEY ||
                    e.key === WeblinksBookmarks.UPDATED_KEY ||
                    e.key === 'uploadedBookmarks') {
                    scheduleStorageRender();
                }
            });

            window.WeblinksTree = {
                getTree: function () { return currentTree; },
                getStats: function () { return { folders: stats.folders, links: stats.links }; }
            };

            var savedTree = WeblinksBookmarks.loadTree();
            render(savedTree);
            if (!savedTree.length) startTreeRecovery();
        })();
    </script>
</body>
</html>
